<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zhang-ling0 | 技术知识库</title>
    <!-- 引入 Markdown 解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入代码高亮库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        /* 全局极简深色风格 */
        :root {
            --bg-color: #000000;
            --surface-color: #0a0a0a;
            --surface-hover: #141414;
            --border-color: #262626;
            --text-primary: #ededed;
            --text-secondary: #a1a1aa;
            --accent: #ffffff;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 24px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        
        .wrapper { 
            max-width: 960px; 
            width: 100%; 
            margin-top: 4vh; 
        }
        
        /* 主页头部排版 */
        .header { 
            margin-bottom: 64px; 
            animation: fadeIn 0.8s ease-out;
        }

        .header h1 { 
            font-size: 3rem; 
            font-weight: 600; 
            letter-spacing: -0.04em; 
            margin-bottom: 16px; 
            color: var(--accent);
        }

        .header h1 span { 
            color: var(--text-secondary);
        }

        .header p { 
            color: var(--text-secondary); 
            font-size: 1.1rem; 
            max-width: 600px; 
            margin-bottom: 24px; 
        }

        .tag { 
            display: inline-block; 
            background: var(--surface-color);
            color: var(--text-secondary); 
            border: 1px solid var(--border-color); 
            padding: 4px 12px; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            font-weight: 500;
        }
        
        /* 卡片网格布局 */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            margin-bottom: 64px; 
            animation: fadeIn 1s ease-out 0.1s both;
        }

        /* 纯平面卡片设计 */
        .card { 
            background: var(--surface-color); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 32px; 
            text-decoration: none; 
            color: var(--text-primary); 
            transition: all 0.2s ease; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            cursor: pointer; 
        }

        .card:hover { 
            background: var(--surface-hover);
            border-color: #404040;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        /* 将表情符号容器改成极简的几何方块 */
        .card-icon { 
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 24px; 
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 8px; 
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .card:hover .card-icon {
            color: var(--accent);
            border-color: #555;
        }

        .card h3 { 
            font-size: 1.2rem; 
            margin-bottom: 12px; 
            font-weight: 500; 
            letter-spacing: -0.01em;
        }

        .card p { 
            color: var(--text-secondary); 
            font-size: 0.95rem; 
            flex-grow: 1; 
            line-height: 1.5;
        }

        .card.disabled { 
            opacity: 0.4; 
            cursor: default; 
            filter: grayscale(100%); 
        }

        .card.disabled:hover { 
            transform: none; 
            border-color: var(--border-color); 
            box-shadow: none; 
            background: var(--surface-color);
        }
        
        .footer { 
            text-align: center; 
            color: var(--text-secondary); 
            font-size: 0.85rem; 
            padding-top: 24px; 
            border-top: 1px solid var(--border-color); 
        }

        /* 阅读器界面样式 */
        #reader-view {
            display: none; 
            width: 100%;
            max-width: 800px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 48px;
            margin-top: 20px;
            animation: fadeIn 0.4s ease-out;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 32px;
            color: var(--text-secondary);
            text-decoration: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .back-btn:hover { 
            color: var(--accent);
        }
        
        /* Markdown 内部排版美化 */
        #markdown-content { line-height: 1.8; color: #d4d4d8; font-size: 1.05rem; }
        #markdown-content h1, #markdown-content h2, #markdown-content h3 { color: var(--accent); margin-top: 1.8em; margin-bottom: 0.6em; font-weight: 600; letter-spacing: -0.02em; }
        #markdown-content h1 { font-size: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        #markdown-content h2 { font-size: 1.5rem; }
        #markdown-content p { margin-bottom: 1.2em; }
        #markdown-content ul, #markdown-content ol { margin-bottom: 1.2em; padding-left: 1.5em; }
        #markdown-content li { margin-bottom: 0.5em; }
        #markdown-content code { background: #1a1a1a; padding: 0.2em 0.4em; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.9em; }
        #markdown-content pre { background: #000000; padding: 20px; border-radius: 8px; overflow-x: auto; margin-bottom: 1.5em; border: 1px solid var(--border-color); }
        #markdown-content pre code { background: transparent; padding: 0; color: #e5e7eb; border: none; }
        #markdown-content blockquote { border-left: 2px solid #555; padding-left: 16px; color: var(--text-secondary); margin-bottom: 1.5em; font-style: italic; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @media (max-width: 600px) {
            body { padding: 30px 16px; }
            .header h1 { font-size: 2.2rem; }
            .card { padding: 24px; }
            #reader-view { padding: 24px; }
        }
    </style>
</head>
<body>

    <div class="wrapper" id="home-view">
        <div class="header">
            <h1>Zhang-ling0 <span>的技术空间</span></h1>
            <p>专注 C++ 后端开发、AI 大模型应用与 Linux 系统编程。</p>
            <div class="tag">持续构建中</div>
        </div>

        <div class="grid">
            <!-- 保持你的原始代码 onclick 绝对不动 -->
            <div class="card" onclick="loadMarkdown('notes/2026-10-10 数据库基础/index.html')">
                <div class="card-icon">DB</div>
                <h3>MySQL 数据库基础</h3>
                <p>包含数据库的基本概念、编码设置与基础操作指南，夯实底层基础。</p>
            </div>

            <div class="card disabled">
                <div class="card-icon">C++</div>
                <h3>C++ 后端开发</h3>
                <p>（内容筹备中）Linux 系统编程、网络编程与高并发服务器设计。</p>
            </div>

            <div class="card disabled">
                <div class="card-icon">AI</div>
                <h3>AI 与大模型实践</h3>
                <p>（内容筹备中）LangChain 应用开发与本地大模型部署踩坑记录。</p>
            </div>
        </div>

        <div class="footer">
            © 2026 Zhang-ling0. Built with Codex.
        </div>
    </div>

    <!-- 阅读器视图（默认隐藏，点击卡片后显示） -->
    <div class="wrapper" id="reader-view">
        <a class="back-btn" onclick="showHome()">← 返回主页</a>
        <div id="markdown-content">
            正在加载笔记内容...
        </div>
    </div>

    <script>
        // 加载并渲染 Markdown
        async function loadMarkdown(url) {
            try {
                // 隐藏主页，显示阅读器
                document.getElementById('home-view').style.display = 'none';
                document.getElementById('reader-view').style.display = 'block';
                document.getElementById('markdown-content').innerHTML = '加载中...';
                
                // 请求 md 文件内容
                const response = await fetch(url);
                if (!response.ok) throw new Error('网络错误，找不到文件');
                const text = await response.text();
                
                // 🔥 修复 Obsidian 的图片语法，自动转成 HTML
                const cleanText = text.replace(/!\[\[(.*?)\]\]/g, '![$1](./notes/$1)');
                
                // 使用 marked.js 转换并渲染
                const html = marked.parse(cleanText);
                document.getElementById('markdown-content').innerHTML = html;
                
                // 触发代码高亮
                document.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });

                // 滚动到顶部
                window.scrollTo(0, 0);
            } catch (error) {
                document.getElementById('markdown-content').innerHTML = 
                    `<h2 style="color:red;">加载失败</h2><p>请检查文件路径是否正确。错误信息：${error.message}</p>`;
            }
        }

        // 返回主页
        function showHome() {
            document.getElementById('reader-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
