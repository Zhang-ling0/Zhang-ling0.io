<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miss Zhang | Developer Space</title>
  
  <style>
    :root {
      --bg: #050811;
      --panel: rgba(14, 20, 36, 0.7);
      --line: rgba(72, 143, 255, 0.15);
      --text: #eaf2ff; 
      --muted: #7b90b5; 
      --cyan: #00f0ff; 
      --purple: #8a2be2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      /* 科技感背景网格 */
      background-image: 
        linear-gradient(rgba(72, 143, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72, 143, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 80px 20px;
    }

    .wrapper { max-width: 1100px; width: 100%; }

    /* 顶部简介 */
    .hero { margin-bottom: 80px; text-align: center; }
    .hero-title { font-size: 4rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 10px; }
    .hero-title span { background: linear-gradient(90deg, var(--cyan), #6595ff, var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero-sub { color: var(--muted); font-size: 1.2rem; letter-spacing: 1px; }

    /* 分类网格 */
    .section-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
    .section-title::before { content: ""; display: block; width: 4px; height: 20px; background: var(--cyan); border-radius: 2px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }

    /* 纯 CSS 几何文件夹卡片 */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 30px;
      text-decoration: none;
      color: var(--text);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      opacity: 0; transition: opacity 0.3s;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 240, 255, 0.1);
    }
    .card:hover::before { opacity: 1; }

    /* 高逼格几何图标 (不用 Emoji) */
    .icon-box {
      width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px; position: relative; background: rgba(0,0,0,0.3);
    }
    .icon-box::after {
      content: ""; width: 16px; height: 16px; border: 2px solid var(--cyan); border-radius: 4px;
      transition: all 0.3s;
    }
    .card:hover .icon-box::after { background: var(--cyan); transform: rotate(45deg); }

    .card-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.5px; }
    .card-desc { color: var(--muted); font-size: 0.95rem; flex-grow: 1; }
    .card-arrow { margin-top: 20px; color: var(--cyan); font-size: 0.9rem; font-weight: 600; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <header class="hero">
      <div class="hero-title">Miss <span>Zhang</span></div>
      <div class="hero-sub">C++ Developer in Progress | Linux & Network Programming | Exploring AI</div>
    </header>

    <h2 class="section-title">Knowledge Base</h2>
    <div id="category-container" class="grid">
      <!-- 卡片由 JS 动态生成 -->
    </div>
  </div>

<script>
  const username = "Zhang-ling0";
  const repo = "Zhang-ling0.io";
  const branch = "gh-pages"; 
  const basePath = "notes";

  async function fetchCategories() {
    const container = document.getElementById("category-container");
    try {
      const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${basePath}?ref=${branch}`);
      if (!response.ok) throw new Error("API Request Failed");
      
      const items = await response.json();
      const folders = items.filter(item => item.type === 'dir');
      
      if (folders.length === 0) {
        container.innerHTML = '<p style="color:var(--muted);">暂无分类。</p>';
        return;
      }

      container.innerHTML = ""; 
      folders.sort((a, b) => a.name.localeCompare(b.name));

      folders.forEach(folder => {
        const a = document.createElement("a");
        a.href = `folder.html?path=${encodeURIComponent(folder.path)}`;
        a.className = "card";
        
        a.innerHTML = `
          <div class="icon-box"></div>
          <div class="card-title">${folder.name}</div>
          <div class="card-desc">Access all documents and files in this module.</div>
          <div class="card-arrow">ENTER →</div>
        `;
        container.appendChild(a);
      });
    } catch (error) {
      container.innerHTML = `<p style="color:#ff4d4f;">System Error: ${error.message}</p>`;
    }
  }
  fetchCategories();
</script>
</body>
</html>
