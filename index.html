<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miss Zhang — Developer Dashboard</title>
  <style>
    /* 保持你原来的 CSS，这里省略，直接用你现有的 style 即可 */
    /* 只需要确保 .grid 的布局是网格 */
    :root {
      --bg: #050b18; --panel: rgba(10, 22, 46, .82); --line: rgba(72, 143, 255, .25);
      --text: #eaf2ff; --muted: #8fa9cf; --cyan: #4deaff; --purple: #a78bfa;
    }
    body { margin: 0; color: var(--text); background: var(--bg); font-family: Inter, system-ui, sans-serif; }
    .layout { min-height: 100vh; display: flex; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: 150px; padding: 30px 12px; background: rgba(3, 10, 24, .96); border-right: 1px solid rgba(71, 126, 209, .2); display: flex; flex-direction: column; }
    .brand { padding: 5px 12px 35px; cursor: pointer; text-decoration: none; display: block;}
    .brand-mark { font-size: 34px; font-weight: 900; letter-spacing: -2px; background: linear-gradient(120deg, var(--cyan), #6595ff 55%, var(--purple)); color: transparent; background-clip: text; }
    .brand-name { margin-top: 10px; font-size: 13px; color: var(--muted); letter-spacing: .04em; }
    .nav { display: grid; gap: 7px; }
    .nav a { display: flex; gap: 12px; align-items: center; padding: 11px 13px; border: 1px solid transparent; border-radius: 12px; color: #9eb3d7; font-size: 13px; text-decoration: none; }
    
    main { margin-left: 150px; padding: 40px; width: 100%; max-width: 1200px; }
    .hero { min-height: 220px; border-radius: 15px; background: #07152d; padding: 30px 56px; margin-bottom: 40px; border: 1px solid rgba(78, 146, 255, .35); }
    h1 { margin: 0 0 9px; font-size: 3rem; }
    .gradient-text { background: linear-gradient(100deg, #fff, var(--cyan) 48%, #a78bfa); color: transparent; background-clip: text; }
    
    /* 分类卡片大网格 */
    .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .category-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 30px; text-decoration: none; color: inherit; transition: 0.3s; display: flex; flex-direction: column; }
    .category-card:hover { transform: translateY(-5px); border-color: var(--cyan); box-shadow: 0 10px 30px rgba(77,234,255,0.1); }
    .category-title { font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
    .category-desc { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <a class="brand" href="index.html">
      <div class="brand-mark">ZH</div><div class="brand-name">Zhang-ling0</div>
    </a>
    <nav class="nav">
      <a href="index.html"><span class="nav-icon">⌂</span><span class="nav-label">Home</span></a>
    </nav>
  </aside>

  <main>
    <header class="hero">
      <div class="hero-greeting">Hi, I’m</div>
      <h1>Miss <span class="gradient-text">Zhang</span></h1>
      <div style="color: #b8c9e5; font-size: 14px;">C++ Developer in Progress | Linux & Network Programming | Exploring AI Systems</div>
    </header>

    <h2 style="font-size: 24px; margin-bottom: 20px; color: #fff;">My Knowledge Base</h2>
    <div id="category-container" class="category-grid">
      <p style="color: var(--muted);">正在加载分类...</p>
    </div>
  </main>
</div>

<script>
  const username = "Zhang-ling0";
  const repo = "Zhang-ling0.io";
  const branch = "gh-pages"; 
  const basePath = "notes";

  async function fetchCategories() {
    const container = document.getElementById("category-container");
    try {
      const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${basePath}?ref=${branch}`);
      if (!response.ok) throw new Error("API 请求失败");
      
      const items = await response.json();
      // 只获取文件夹
      const folders = items.filter(item => item.type === 'dir');
      
      if (folders.length === 0) {
        container.innerHTML = '<p class="muted">暂无分类。</p>';
        return;
      }

      container.innerHTML = ""; 

      folders.sort((a, b) => a.name.localeCompare(b.name));

      folders.forEach(folder => {
        const a = document.createElement("a");
        // 点击直接跳转到 folder.html，并带上路径参数
        a.href = `folder.html?path=${encodeURIComponent(folder.path)}`;
        a.className = "category-card";
        
        a.innerHTML = `
          <div class="category-title">📁 ${folder.name}</div>
          <div class="category-desc">点击查看该分类下的所有 PDF 文档 →</div>
        `;
        container.appendChild(a);
      });
    } catch (error) {
      container.innerHTML = `<p style="color:#f87171">加载失败: ${error.message}</p>`;
    }
  }

  fetchCategories();
</script>
</body>
</html>
