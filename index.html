<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zhang-ling0 | 技术知识库</title>
    <!-- 引入 Markdown 解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入代码高亮库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        /* 浅色科技风变量 */
        :root {
            --bg-color: #f5f5f7;         /* 苹果高级浅灰背景 */
            --surface-color: #ffffff;    /* 纯白卡片 */
            --text-primary: #1d1d1f;     /* 极深灰文字 */
            --text-secondary: #86868b;   /* 辅助浅灰 */
            --border-color: #d2d2d7;     /* 极细边框 */
            --accent: #0071e3;           /* 极客科技蓝 */
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.08);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        /* 绘制一个极其微弱的科技网格背景 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 40px 40px; /* 网格大小 */
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 24px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        
        .wrapper { 
            max-width: 960px; 
            width: 100%; 
        }
        
        /* 头部排版 */
        .header { 
            margin-bottom: 64px; 
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header h1 { 
            font-size: 3rem; 
            font-weight: 700; 
            letter-spacing: -0.05em; 
            margin-bottom: 16px; 
            color: var(--text-primary);
        }

        .header h1 span { 
            color: var(--text-secondary);
            font-weight: 400;
        }

        .header p { 
            color: var(--text-secondary); 
            font-size: 1.15rem; 
            max-width: 600px; 
            margin-bottom: 24px; 
            font-weight: 400;
            letter-spacing: -0.01em;
        }

        .tag { 
            display: inline-block; 
            background: var(--surface-color);
            color: var(--text-primary); 
            border: 1px solid var(--border-color); 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            font-weight: 500;
            box-shadow: var(--shadow-sm);
        }
        
        /* 卡片网格 */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 24px; 
            margin-bottom: 64px; 
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
        }

        /* 纯白科技感卡片 */
        .card { 
            background: var(--surface-color); 
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            padding: 32px; 
            text-decoration: none; 
            color: var(--text-primary); 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            display: flex; 
            flex-direction: column; 
            cursor: pointer; 
            box-shadow: var(--shadow-sm);
        }

        .card:hover { 
            transform: translateY(-4px) scale(1.01); /* 微弹悬浮 */
            border-color: var(--accent);
            box-shadow: var(--shadow-lg);
        }

        /* 卡片左上角方块标识 */
        .card-icon { 
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            margin-bottom: 24px; 
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px; 
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .card:hover .card-icon {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        .card h3 { 
            font-size: 1.25rem; 
            margin-bottom: 12px; 
            font-weight: 600; 
            letter-spacing: -0.02em;
        }

        .card p { 
            color: var(--text-secondary); 
            font-size: 0.95rem; 
            flex-grow: 1; 
            line-height: 1.5;
        }

        /* 禁用状态 */
        .card.disabled { 
            background: rgba(255, 255, 255, 0.5);
            border-color: transparent;
            box-shadow: none;
            cursor: default; 
            opacity: 0.6;
        }

        .card.disabled:hover { 
            transform: none; 
            border-color: transparent; 
            box-shadow: none; 
        }
        
        .footer { 
            text-align: center; 
            color: var(--text-secondary); 
            font-size: 0.85rem; 
            padding-top: 24px; 
            border-top: 1px solid var(--border-color); 
        }

        /* 阅读器界面 */
        #reader-view {
            display: none; 
            width: 100%;
            max-width: 800px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 48px;
            margin: 0 auto;
            animation: fadeIn 0.4s ease-out;
            box-shadow: var(--shadow-lg);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            margin-bottom: 32px;
            color: var(--text-secondary);
            text-decoration: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.2s;
        }

        .back-btn:hover { 
            color: var(--accent);
        }
        
        /* Markdown 浅色排版 */
        #markdown-content { line-height: 1.7; color: var(--text-primary); font-size: 1.05rem; }
        #markdown-content h1, #markdown-content h2, #markdown-content h3 { color: #000; margin-top: 1.8em; margin-bottom: 0.6em; font-weight: 600; letter-spacing: -0.02em; }
        #markdown-content h1 { font-size: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        #markdown-content h2 { font-size: 1.5rem; }
        #markdown-content p { margin-bottom: 1.2em; }
        #markdown-content ul, #markdown-content ol { margin-bottom: 1.2em; padding-left: 1.5em; }
        #markdown-content li { margin-bottom: 0.5em; }
        #markdown-content code { background: #f5f5f7; padding: 0.2em 0.4em; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 0.9em; color: #e01e5a; }
        #markdown-content pre { background: #fafafa; padding: 20px; border-radius: 12px; overflow-x: auto; margin-bottom: 1.5em; border: 1px solid var(--border-color); }
        #markdown-content pre code { background: transparent; padding: 0; color: #333; border: none; }
        #markdown-content blockquote { border-left: 4px solid var(--accent); padding-left: 16px; color: var(--text-secondary); margin-bottom: 1.5em; background: #f5f5f7; padding: 12px 16px; border-radius: 0 8px 8px 0; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @media (max-width: 600px) {
            body { padding: 40px 16px; }
            .header h1 { font-size: 2.2rem; }
            .card { padding: 24px; }
            #reader-view { padding: 24px; }
        }
    </style>
</head>
<body>

    <div class="wrapper" id="home-view">
        <div class="header">
            <h1>Zhang-ling0 <span>的技术空间</span></h1>
            <p>专注 C++ 后端开发、AI 大模型应用与 Linux 系统编程。</p>
            <div class="tag">持续构建中</div>
        </div>

        <div class="grid">
            <!-- 你的原始代码，绝对没动 -->
            <div class="card" onclick="loadMarkdown('notes/2026-10-10 数据库基础/index.html')">
                <div class="card-icon">DB</div>
                <h3>MySQL 数据库基础</h3>
                <p>包含数据库的基本概念、编码设置与基础操作指南，夯实底层基础。</p>
            </div>

            <div class="card disabled">
                <div class="card-icon">C++</div>
                <h3>C++ 后端开发</h3>
                <p>（内容筹备中）Linux 系统编程、网络编程与高并发服务器设计。</p>
            </div>

            <div class="card disabled">
                <div class="card-icon">AI</div>
                <h3>AI 与大模型实践</h3>
                <p>（内容筹备中）LangChain 应用开发与本地大模型部署踩坑记录。</p>
            </div>
        </div>

        <div class="footer">
            © 2026 Zhang-ling0. Built with Codex.
        </div>
    </div>

    <!-- 阅读器视图（默认隐藏，点击卡片后显示） -->
    <div class="wrapper" id="reader-view">
        <a class="back-btn" onclick="showHome()">← 返回主页</a>
        <div id="markdown-content">
            正在加载笔记内容...
        </div>
    </div>

    <script>
        // 加载并渲染 Markdown
        async function loadMarkdown(url) {
            try {
                // 隐藏主页，显示阅读器
                document.getElementById('home-view').style.display = 'none';
                document.getElementById('reader-view').style.display = 'block';
                document.getElementById('markdown-content').innerHTML = '加载中...';
                
                // 请求 md 文件内容
                const response = await fetch(url);
                if (!response.ok) throw new Error('网络错误，找不到文件');
                const text = await response.text();
                
                // 🔥 修复 Obsidian 的图片语法，自动转成 HTML
                const cleanText = text.replace(/!\[\[(.*?)\]\]/g, '![$1](./notes/$1)');
                
                // 使用 marked.js 转换并渲染
                const html = marked.parse(cleanText);
                document.getElementById('markdown-content').innerHTML = html;
                
                // 触发代码高亮
                document.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });

                // 滚动到顶部
                window.scrollTo(0, 0);
            } catch (error) {
                document.getElementById('markdown-content').innerHTML = 
                    `<h2 style="color:red;">加载失败</h2><p>请检查文件路径是否正确。错误信息：${error.message}</p>`;
            }
        }

        // 返回主页
        function showHome() {
            document.getElementById('reader-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
