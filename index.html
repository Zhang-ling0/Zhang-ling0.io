<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zhang-ling0 的个人知识库</title>
    <style>
        /* 全局样式：深色背景、无衬线字体 */
        :root {
            --bg-color: #0d1117;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #4CAF50;
            --card-bg: #161b22;
            --card-border: #30363d;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 主容器 */
        .container {
            max-width: 800px;
            width: 90%;
            padding: 40px 20px;
        }

        /* 头部介绍区 */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        .header h1 {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .header h1 span {
            color: var(--accent-color);
        }
        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 状态标签 */
        .badge {
            display: inline-block;
            background-color: rgba(76, 175, 80, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(76, 175, 80, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 15px;
            font-weight: 500;
        }

        /* 卡片网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* 单个卡片样式 */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        
        /* 卡片顶部的装饰线 */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--accent-color);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .card:hover::before {
            opacity: 1;
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 15px;
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1.25rem;
            color: #ffffff;
        }
        .card p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            flex-grow: 1;
        }

        /* 底部版权 */
        .footer {
            text-align: center;
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头部区域 -->
        <div class="header">
            <h1>Zhang-ling0 的<span>知识库</span></h1>
            <p>专注 C++ 后端开发、AI 大模型应用与 Linux 系统编程。这里记录了我的学习笔记与项目实战经验。</p>
            <div class="badge">🌱 持续学习与更新中</div>
        </div>

        <!-- 笔记卡片列表 -->
        <div class="grid">
            
            <!-- 卡片 1：MySQL 笔记 -->
            <a href="./src/site/notes/2026-10-10%20数据库基础.md" class="card">
                <div class="card-icon">🗄️</div>
                <h3>MySQL 数据库基础</h3>
                <p>包含数据库的基本概念、编码设置与基础操作指南。</p>
            </a>

            <!-- 卡片 2：占位符（你可以后续添加更多） -->
            <div class="card" style="opacity: 0.6; cursor: not-allowed;">
                <div class="card-icon">💻</div>
                <h3>C++ 后端开发笔记</h3>
                <p>（敬请期待）Linux 系统编程、网络编程与高并发服务器设计。</p>
            </div>

            <!-- 卡片 3：占位符 -->
            <div class="card" style="opacity: 0.6; cursor: not-allowed;">
                <div class="card-icon">🤖</div>
                <h3>AI 与大模型实践</h3>
                <p>（敬请期待）LangChain 应用开发与本地大模型部署踩坑记录。</p>
            </div>

        </div>

        <!-- 底部 -->
        <div class="footer">
            © 2026 Zhang-ling0. Built with ❤️ and GitHub Pages.
        </div>
    </div>

</body>
</html>
