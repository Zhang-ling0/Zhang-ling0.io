<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folder - Miss Zhang</title>
  <style>
    :root {
      --bg: #050b18; --panel: rgba(10, 22, 46, .82); --line: rgba(72, 143, 255, .25);
      --text: #eaf2ff; --muted: #8fa9cf; --cyan: #4deaff; --purple: #a78bfa;
      --radius: 20px; --shadow: 0 18px 55px rgba(0,0,0,.22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--text); background: radial-gradient(ellipse at 80% 0%, rgba(77, 50, 170, .19), transparent 34rem), radial-gradient(ellipse at 20% 22%, rgba(0, 155, 255, .10), transparent 30rem), var(--bg);
      font-family: Inter, system-ui, sans-serif; line-height: 1.55;
    }
    .layout { min-height: 100vh; display: flex; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: 150px; padding: 30px 12px;
      background: rgba(3, 10, 24, .96); border-right: 1px solid rgba(71, 126, 209, .2);
      backdrop-filter: blur(18px); z-index: 5; display: flex; flex-direction: column;
    }
    .brand { padding: 5px 12px 35px; cursor: pointer; text-decoration: none; display: block;}
    .brand-mark { font-size: 34px; font-weight: 900; letter-spacing: -2px; line-height: 1;
      background: linear-gradient(120deg, var(--cyan), #6595ff 55%, var(--purple)); color: transparent; background-clip: text; }
    .brand-name { margin-top: 10px; font-size: 13px; color: var(--muted); letter-spacing: .04em; }
    .nav { display: grid; gap: 7px; }
    .nav a { display: flex; gap: 12px; align-items: center; padding: 11px 13px; border: 1px solid transparent; border-radius: 12px; color: #9eb3d7; font-size: 13px; text-decoration: none; transition: .2s ease; }
    .nav a:hover { color: var(--cyan); border-color: rgba(55, 145, 255, .24); background: linear-gradient(100deg, rgba(13, 105, 205, .28), rgba(23, 41, 81, .3)); transform: translateX(2px); }
    .nav-icon { width: 18px; text-align: center; font-size: 15px; }
    
    main { margin-left: 150px; padding: 40px; width: 100%; max-width: 1200px; }
    .back-btn { display: inline-block; margin-bottom: 20px; color: var(--muted); text-decoration: none; font-size: 14px; transition: 0.2s; }
    .back-btn:hover { color: var(--cyan); }
    h1 { font-size: 2.5rem; margin: 0 0 30px 0; color: #fff; }

    /* 树状层级 UI */
    .tree-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
    .tree ul { list-style: none; padding-left: 20px; margin: 0; border-left: 1px dashed rgba(77, 234, 255, 0.2); }
    .tree > ul { padding-left: 0; border-left: none; }
    .tree li { position: relative; padding: 4px 0; }
    
    /* 文件夹和文件项 */
    .folder-title { display: flex; align-items: center; cursor: pointer; padding: 8px 12px; border-radius: 8px; font-weight: 600; color: #d7e5ff; transition: 0.2s; }
    .folder-title:hover { background: rgba(16,122,219,.15); color: var(--cyan); }
    .folder-title::before { content: '▶'; font-size: 10px; margin-right: 8px; color: var(--cyan); transition: transform 0.2s; }
    .folder-title.open::before { transform: rotate(90deg); }
    
    .file-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 8px 30px; border-radius: 8px; text-decoration: none; color: var(--text); transition: 0.2s; border: 1px solid transparent; }
    .file-item:hover { background: rgba(16,122,219,.15); border-color: rgba(77,234,255,.3); }
    .file-name { font-size: 13px; color: #b8c9e5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-action { font-size: 11px; color: var(--cyan); opacity: 0; transition: 0.2s; }
    .file-item:hover .file-action { opacity: 1; }

    /* 子菜单折叠 */
    .sub-tree { display: none; }
    .sub-tree.active { display: block; animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <a class="brand" href="index.html">
      <div class="brand-mark">ZH</div><div class="brand-name">Zhang-ling0</div>
    </a>
    <nav class="nav">
      <a href="index.html"><span class="nav-icon">⌂</span><span class="nav-label">Home</span></a>
    </nav>
  </aside>

  <main>
    <a href="index.html" class="back-btn">← 返回主页</a>
    <h1 id="page-title">Loading...</h1>
    <div class="tree-panel">
      <div id="tree-root" class="tree">
        <p style="color: var(--muted);">正在读取目录...</p>
      </div>
    </div>
  </main>
</div>

<script>
  const username = "Zhang-ling0";
  const repo = "Zhang-ling0.io";
  const branch = "gh-pages"; 

  // 从 URL 获取当前要展示的文件夹路径 (比如 ?path=notes/LinuxNetworking)
  const urlParams = new URLSearchParams(window.location.search);
  const currentPath = urlParams.get('path') || 'notes';
  
  // 设置标题
  const titleName = currentPath.split('/').pop();
  document.getElementById("page-title").innerText = titleName;
  document.title = titleName + " - Miss Zhang";

  async function fetchTree(path) {
    try {
      const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${path}?ref=${branch}`);
      if (!response.ok) throw new Error("获取失败");
      return await response.json();
    } catch (e) {
      return [];
    }
  }

  // 递归生成树形结构
  async function buildTreeDOM(path, container) {
    const items = await fetchTree(path);
    if (items.length === 0) {
      container.innerHTML = '<p style="color:var(--muted);">空文件夹</p>';
      return;
    }

    // 排序：文件夹在前，文件在后
    items.sort((a, b) => {
      if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
      return a.name.localeCompare(b.name);
    });

    const ul = document.createElement('ul');

    for (const item of items) {
      const li = document.createElement('li');

      if (item.type === 'dir') {
        // 渲染文件夹
        const title = document.createElement('div');
        title.className = 'folder-title';
        title.innerHTML = `📁 ${item.name}`;
        
        const subContainer = document.createElement('div');
        subContainer.className = 'sub-tree';
        
        // 点击折叠/展开
        title.onclick = async () => {
          title.classList.toggle('open');
          subContainer.classList.toggle('active');
          // 如果是第一次展开，去加载里面的内容
          if (subContainer.innerHTML === '') {
            await buildTreeDOM(item.path, subContainer);
          }
        };

        li.appendChild(title);
        li.appendChild(subContainer);
      } else if (item.type === 'file' && item.name.endsWith('.pdf')) {
        // 渲染 PDF 文件
        const a = document.createElement('a');
        a.className = 'file-item';
        a.href = `./${item.path}`;
        a.target = '_blank';
        a.innerHTML = `
          <div class="file-name">📄 ${item.name.replace('.pdf', '')}</div>
          <div class="file-action">Open ↗</div>
        `;
        li.appendChild(a);
      }
      ul.appendChild(li);
    }
    container.appendChild(ul);
  }

  // 初始化
  buildTreeDOM(currentPath, document.getElementById("tree-root"));
</script>
</body>
</html>
