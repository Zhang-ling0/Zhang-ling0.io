<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folder | Miss Zhang</title>
  <style>
    :root {
      --bg: #050811;
      --panel: rgba(14, 20, 36, 0.7);
      --line: rgba(72, 143, 255, 0.15);
      --text: #eaf2ff; 
      --muted: #7b90b5; 
      --cyan: #00f0ff; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      background-image: 
        linear-gradient(rgba(72, 143, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72, 143, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 60px 20px;
    }

    .wrapper { max-width: 900px; width: 100%; }

    .top-bar { display: flex; align-items: center; margin-bottom: 40px; gap: 20px; }
    .back-btn {
      text-decoration: none; color: var(--muted); font-size: 0.9rem; padding: 8px 16px;
      border: 1px solid var(--line); border-radius: 8px; transition: 0.3s;
      background: var(--panel); backdrop-filter: blur(10px);
    }
    .back-btn:hover { color: var(--cyan); border-color: var(--cyan); }

    h1 { font-size: 2.5rem; font-weight: 800; color: #fff; letter-spacing: -1px; }

    /* 极简科技风树状目录 */
    .tree-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px 30px;
      backdrop-filter: blur(12px);
    }

    .tree ul { list-style: none; padding-left: 24px; margin: 0; border-left: 1px dashed rgba(72, 143, 255, 0.2); }
    .tree > ul { padding-left: 0; border-left: none; }
    .tree li { position: relative; padding: 2px 0; }
    
    /* 文件夹样式 */
    .folder-title {
      display: flex; align-items: center; cursor: pointer; padding: 12px 16px;
      border-radius: 8px; font-weight: 600; font-size: 1.05rem; color: var(--text); transition: 0.2s;
    }
    .folder-title:hover { background: rgba(72, 143, 255, 0.1); color: var(--cyan); }
    
    /* 纯 CSS 小三角指示器 */
    .folder-title::before {
      content: ''; width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent;
      border-left: 6px solid var(--cyan); margin-right: 12px; transition: transform 0.2s;
    }
    .folder-title.open::before { transform: rotate(90deg); }
    
    /* 文件条目 */
    .file-item {
      display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 12px 40px;
      border-radius: 8px; text-decoration: none; color: var(--muted); transition: 0.2s;
      font-size: 0.95rem; border-left: 2px solid transparent;
    }
    .file-item:hover {
      background: rgba(0, 240, 255, 0.05); color: #fff; border-left-color: var(--cyan); padding-left: 46px;
    }
    
    .file-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-action { font-size: 0.8rem; color: var(--cyan); opacity: 0; transition: 0.2s; letter-spacing: 1px; }
    .file-item:hover .file-action { opacity: 1; }

    /* 折叠动画 */
    .sub-tree { display: none; }
    .sub-tree.active { display: block; animation: slideDown 0.3s ease-out; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <a href="index.html" class="back-btn">← RETURN TO DASHBOARD</a>
    </div>
    <h1 id="page-title" style="margin-bottom: 30px;">Loading...</h1>
    
    <div class="tree-panel">
      <div id="tree-root" class="tree" style="color: var(--muted);">
        Fetching directory structure...
      </div>
    </div>
  </div>

<script>
  const username = "Zhang-ling0";
  const repo = "Zhang-ling0.io";
  const branch = "gh-pages"; 

  const urlParams = new URLSearchParams(window.location.search);
  const currentPath = urlParams.get('path') || 'notes';
  
  const titleName = currentPath.split('/').pop();
  document.getElementById("page-title").innerText = titleName;
  document.title = titleName + " | Miss Zhang";

  async function fetchTree(path) {
    try {
      const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${path}?ref=${branch}`);
      if (!response.ok) throw new Error("Fetch Failed");
      return await response.json();
    } catch (e) {
      return [];
    }
  }

  // 递归渲染
  async function buildTreeDOM(path, container) {
    const items = await fetchTree(path);
    if (items.length === 0) {
      container.innerHTML = '<span style="color:var(--muted); font-size:0.9rem;">Empty Directory</span>';
      return;
    }

    items.sort((a, b) => {
      if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
      return a.name.localeCompare(b.name);
    });

    const ul = document.createElement('ul');

    for (const item of items) {
      const li = document.createElement('li');

      if (item.type === 'dir') {
        const title = document.createElement('div');
        title.className = 'folder-title';
        title.innerText = item.name; // 纯文本，无表情
        
        const subContainer = document.createElement('div');
        subContainer.className = 'sub-tree';
        
        title.onclick = async () => {
          title.classList.toggle('open');
          subContainer.classList.toggle('active');
          if (subContainer.innerHTML === '') {
            await buildTreeDOM(item.path, subContainer);
          }
        };

        li.appendChild(title);
        li.appendChild(subContainer);
      } else if (item.type === 'file' && item.name.endsWith('.pdf')) {
        const a = document.createElement('a');
        a.className = 'file-item';
        a.href = `./${item.path}`;
        a.target = '_blank';
        a.innerHTML = `
          <div class="file-name">${item.name.replace('.pdf', '')}</div>
          <div class="file-action">OPEN ↗</div>
        `;
        li.appendChild(a);
      }
      ul.appendChild(li);
    }
    container.innerHTML = "";
    container.appendChild(ul);
  }

  buildTreeDOM(currentPath, document.getElementById("tree-root"));
</script>
</body>
</html>
